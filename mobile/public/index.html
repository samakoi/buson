<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: no iPhone instalado, o app usa a tela toda (as margens seguras vêm do SafeAreaProvider) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bus On</title>
    <meta name="description" content="Bus On: transporte universitário sem fila e sem surpresa." />
    <!-- PWA: instalar pelo navegador (Android: "Instalar app"; iPhone: Compartilhar › Adicionar à Tela de Início) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E5AA8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bus On" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #f4f7fb;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b1520;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Para usar o Bus On, ative o JavaScript no navegador.</noscript>
    <div id="root"></div>
  </body>
</html>
