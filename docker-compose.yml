version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: bus_on_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: bus_on
    ports:
      - "3306:3306"
    volumes:
      - bus_on_mysql_data:/var/lib/mysql

volumes:
  bus_on_mysql_data:
